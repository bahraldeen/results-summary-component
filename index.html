<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Results summary component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="result">
  <h1>Your Result</h1>
  <div class="fulldegree">
  <h1>76</h1>
  <p>of 100</p>
</div>
  <h3>Great</h3>
  <p class="info">You scored higher than 65% of the people who have taken these tests.</p>
  </div>
  <div class="summary">
 <h2>Summary</h2> 
<div class="score" style="background-color: hsla(0, 100%, 67%, 0.096);">
 <span style="color: hsl(0, 100%, 67%);">Reaction</span> 
 <span style="color: hsl(224, 30%, 27%);">80 / 100</span> 
</div>
 <div class="score" style="background-color: hsla(39, 100%, 56%, 0.091);">
   <span style="color: hsl(39, 100%, 56%);">Memory</span>
  <span style="color: hsl(224, 30%, 27%);">92 / 100</span>
</div>
 <div class="score" style="background-color: hsla(166, 100%, 37%, 0.119);">
   <span style="color: hsl(166, 100%, 37%);">Verbal</span>
  <span style="color: hsl(224, 30%, 27%);">61 / 100</span>
</div>
 <div class="score" style="background-color: hsla(234, 85%, 45%, 0.123);">
   <span style="color: hsl(234, 85%, 45%);">Visual</span>
 <span style="color: hsl(224, 30%, 27%);">72 / 100</span> 
</div>
  <button>Continue</button>
  </div>
  </div>
  <footer class="attribution" class="score">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/bahraldeen">Bhraldeen Adam Babker</a>.
  </footer>
</body>
</html>
